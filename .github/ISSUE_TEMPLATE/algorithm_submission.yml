name: Algorithm Submission (算法提交或结果更新)
description: Submit benchmark results for a new or updated difficulty estimation algorithm (提交新算法结果或更新现有算法)
title: "[Algorithm]: "
labels: ["algorithm"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for submitting an algorithm to the VSRG Dan Estimation Benchmark!
        Please read [algorithm.md](docs/algorithm.md) and [runner.md](docs/runner.md) before submitting.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist (提交前检查)
      options:
        - label: The CSV file header is exactly `bid,name,pattern,subPattern,expected,got,delta,deltaAbs`.
          required: true
        - label: Only `got`, `delta`, and `deltaAbs` columns were modified; all other columns match `samples/data.csv`.
          required: true
        - label: `got` is scaled to the Reform Dan numeric difficulty scale (e.g., DanOverlay DP converted with `- 0.5`).
          required: true
        - label: Non-numeric results use standard markers: `Invalid`, `Missing`, `Failed`.
          required: true

  - type: input
    id: algorithm_name
    attributes:
      label: Algorithm Name (算法名称)
      description: The display name of the algorithm (must match `{Algorithm}.csv`).
      placeholder: e.g. Sunny, Daniel, Roxy, MyNewEstimator
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Algorithm Repository / Source URL (算法仓库或开源链接)
      placeholder: e.g. https://github.com/username/algorithm-repo

  - type: textarea
    id: result_summary
    attributes:
      label: Benchmark Results & Overview (评测结果摘要)
      description: Please provide a summary of the algorithm, its scope (e.g. 4K RC only, full 4K, etc.), overall MAE / RMSE, and attach your `{Algorithm}.csv` file or provide a link.
      placeholder: Briefly explain the algorithm mechanics and attach your result CSV here.
    validations:
      required: true
